services:
  # Backend API Service
  - type: web
    name: sleepease-backend
    env: python
    rootDir: SleepEase_Backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false # You will need to add this manually in the Render dashboard
      - key: FIREBASE_CREDENTIALS
        sync: false # You will need to paste the entire serviceAccountKey.json contents here


